<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Bud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <div class="bg-orbs" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <div class="scene" id="scene">
        <div class="card">
            <form id="form" autocomplete="off">
                <div class="header">
                    <div class="icon-3d" id="brandIcon">
                        <span class="face face-front">🛒</span>
                        <span class="face face-bottom">🛒</span>
                    </div>
                    <h1>Grocery Bud</h1>
                    <p class="subtitle">Add your items, stay organized ✨</p>
                    <div class="counter" id="counter">0 items</div>
                </div>

                <div class="input-container">
                    <input type="text" id="input-box" placeholder="e.g. eggs, milk, bread..." autofocus>
                    <button type="submit" id="submit">
                        <span class="btn-label">Add</span>
                        <span class="btn-icon">+</span>
                    </button>
                </div>

                <ul id="List">
                </ul>

                <p id="clear-items">Clear all items</p>
            </form>
        </div>
    </div>

    <div id="toast" class="toast">✓ Item added</div>

    <script src="cart.js"></script>
</body>
</html>
